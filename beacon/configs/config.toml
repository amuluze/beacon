[App]
Env = "production"

[Fiber]
Host = "0.0.0.0"      # http监听地址
Port = 8000           # http监听端口
ShutdownTimeout = 30  # http优雅关闭等待超时时长(单位秒)
ServerHeader = "beacon"
AppName = "beacon"
Prefork = false
ReadTimeout = 30      # 读请求超时(秒)，0 或缺省兜底为 30s；防止慢速请求耗尽内存
WriteTimeout = 30     # 写响应超时(秒)，0 或缺省兜底为 30s
IdleTimeout = 120     # keepalive 空闲超时(秒)，0 或缺省兜底为 120s；回收半开连接

[Control]
Enable = true          # 启用反向 gRPC tunnel，控制通道由 Agent 主动连接 Server
Address = ":17000"     # gRPC 控制端口
JoinToken = ""          # Agent 反向隧道注册令牌；为空时复用 AgentInstall.Token

[Control.TLS]
Enable = true
CertDir = "/etc/beacon/control-certs"  # beacon 启动时若目录缺少 ca.pem/tls.crt/tls.key 则自动生成自签 CA 与服务端证书
ClientNames = []

[Gorm]
Debug = false            # 生产环境关闭 SQL 调试日志；启用时仍使用参数化日志
DBType = "sqlite"        # 数据库类型(目前支持的数据库类型：postgres, sqlite)
MaxLifetime = 7200       # 设置连接可以重用的最长时间(单位：秒)
MaxOpenConns = 150       # 设置数据库的最大打开连接数
MaxIdleConns = 50        # 设置空闲连接池中的最大连接数
TablePrefix = "s_"       # 数据库表名前缀
EnableAutoMigrate = true # 是否启用自动映射数据库表结构

[DB]
Host = ""             # 连接地址
Port = ""             # 连接端口
User = ""             # 用户名
Password = ""         # 密码
DBName = "/app/beacon" # 数据库
SSLMode = ""          # SSL模式

[Log]
Output = "/app/logs/beacon.log" # 日志存放路径
Level = "debug"                # 日志等级
Rotation = 1                   # 每天切分一个日志文件
MaxAge = 7                     # 最多保留 7 天的日志

[Auth]
Enable = true           # 是否启用
SigningMethod = "HS512" # 签名方式(支持：HS512/HS384/HS512)
# ⚠️ 生产环境必须通过环境变量 BEACON_AUTH_SIGNING_KEY 设置强随机密钥，
# 或替换下方默认值。保留 "beacon" 会在启动时发出 WARN 日志。
SigningKey = ""        # 必须通过 BEACON_AUTH_SIGNING_KEY 注入
Expired = 7200          # 过期时间（单位秒）
RefreshExpired = 86400  # 刷新过期时间（单位秒）
Prefix = "auth_"        # key 前缀

[Casbin]
Enable = true         # 是否启用casbin
Debug = false         # debug模式
AutoLoad = true       # 是否启用定期自动加载策略
AutoLoadInternal = 60 # 定期自动加载策略时间间隔（单位秒）

[Task]
Interval = 15

[AgentInstall]
Enable = true
# ⚠️ 生产环境必须通过环境变量 BEACON_AGENT_INSTALL_TOKEN 设置，
# 或替换下方默认值。保留 "change-me" 会在启动时发出 WARN 日志。
Token = ""             # 必须通过 BEACON_AGENT_INSTALL_TOKEN 注入
PublicBaseURL = ""       # 生产环境必须通过 BEACON_PUBLIC_BASE_URL 注入 HTTPS 地址
PackageDir = "/app/downloads/collia"
ControlPort = 17000
TLSEnable = true
CertDir = "/etc/collia/certs"

[AgentUpdate]
Enable = true          # 部署级门禁：Agent 注册后自动比较并升级到镜像内置 Collia 版本；控制台「探针管理」开关可在此基础上关闭自动调度
TargetVersion = ""     # 生产镜像通过 BEACON_COLLIA_VERSION 注入
Timeout = 300          # 单次升级超时（秒）
MaxConcurrent = 2      # Server 全局最大并发升级数
RetryInterval = 1800   # 自动升级失败冷却（秒）；管理员手动重试可绕过

[InstallReport]
Enable = false  # 默认关闭；仅在知情并同意发送下列安装信息时显式设为 true
URL = "https://beacon.amuluze.com/api/v1/install/report" # 启用后接收安装统计的目标地址
InstallDir = "/data/beacon"
IDFile = "/app/data/install.id"
Timeout = 5

[Update]
Enable = true                                    # 启用版本轮询；关闭则仅在启动时检查一次
URL = "https://beacon.amuluze.com"               # beacon-help 版本清单基础 URL
CheckInterval = 21600                            # 轮询间隔（秒），默认 6h，最低 1h（version_check.go 兜底）

[Retention]
Days = 7        # 监控时间序列数据（CPU/内存/磁盘/网络/容器）保留天数
AuditDays = 90  # 审计日志保留天数
