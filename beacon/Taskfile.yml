version: '3'

vars:
  APP: beacon
  SERVER: ./cmd/{{.APP}}
  BEACON_VERSION:
    # Included Taskfiles inherit the caller's TASKFILE_DIR in some Task
    # versions. Resolve from the workspace root when included, while keeping
    # standalone `cd beacon && task ...` usage working.
    sh: |
      if [ -f "{{.ROOT_DIR}}/beacon/VERSION" ]; then
        cat "{{.ROOT_DIR}}/beacon/VERSION"
      else
        cat "{{.TASKFILE_DIR}}/VERSION"
      fi
  COLLIA_VERSION:
    sh: |
      if [ -f "{{.ROOT_DIR}}/collia/VERSION" ]; then
        cat "{{.ROOT_DIR}}/collia/VERSION"
      else
        cat "{{.TASKFILE_DIR}}/../collia/VERSION"
      fi
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  # amd64 与 arm64 走不同的镜像仓库，对齐 manager.sh 中 BEACON_ARCH 分支：
  #   amd64 -> amuluze/beacon
  #   arm64 -> amuluze/beacon-arm
  # 每次发布同时推送阿里云与 Docker Hub（同 tag 同内容），安装器主源失败时回退 Docker Hub。
  IMAGE: '{{.REGISTRY}}/amuluze/beacon'
  IMAGE_ARM: '{{.REGISTRY}}/amuluze/beacon-arm'
  DOCKERHUB_IMAGE: 'docker.io/amuluze/beacon'
  DOCKERHUB_IMAGE_ARM: 'docker.io/amuluze/beacon-arm'
  TAG: '{{.BEACON_VERSION}}'
  DEV_CONFIG_FILE: '{{.TASKFILE_DIR}}/configs/config.dev.toml'
  MODEL_FILE: '{{.TASKFILE_DIR}}/configs/model.conf'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  dev:
    desc: Run beacon with development config
    cmds:
      - go run {{.SERVER}}/main.go run -c {{.DEV_CONFIG_FILE}} -m {{.MODEL_FILE}}

  wire:
    desc: Generate Wire injector code
    cmds:
      - wire ./service/

  bin:
    desc: Build local beacon binary
    vars:
      STAMP:
        sh: date +%s
      GIT_HASH:
        sh: git rev-parse --short=8 HEAD
      GIT_BRANCH:
        sh: git rev-parse --abbrev-ref HEAD
    cmds:
      - go build -ldflags "-w -s -X main.BuildStamp={{.STAMP}} -X main.GitHash={{.GIT_HASH}} -X main.GitBranch={{.GIT_BRANCH}} -X main.Version={{.BEACON_VERSION}}" -o {{.APP}} {{.SERVER}}

  amd64:
    desc: Build linux/amd64 Docker image into local Docker
    cmds:
      - docker buildx build --platform linux/amd64 -f Dockerfile --build-arg APK_REPOSITORY={{default "" .APK_REPOSITORY}} --build-arg BEACON_VERSION={{.BEACON_VERSION}} --build-arg COLLIA_VERSION={{.COLLIA_VERSION}} -t {{.IMAGE}}:{{.TAG}} -o type=docker ..

  arm64:
    desc: Build linux/arm64 Docker image into local Docker
    cmds:
      - docker buildx build --platform linux/arm64 -f Dockerfile --build-arg APK_REPOSITORY={{default "" .APK_REPOSITORY}} --build-arg BEACON_VERSION={{.BEACON_VERSION}} --build-arg COLLIA_VERSION={{.COLLIA_VERSION}} -t {{.IMAGE_ARM}}:{{.TAG}} -o type=docker ..

  build:
    desc: Build and push amd64/arm64 Docker images to Aliyun and Docker Hub (same tag, one build per arch)
    cmds:
      - docker buildx build --platform linux/amd64 -f Dockerfile --build-arg APK_REPOSITORY={{default "" .APK_REPOSITORY}} --build-arg BEACON_VERSION={{.BEACON_VERSION}} --build-arg COLLIA_VERSION={{.COLLIA_VERSION}} --provenance=false --sbom=0 -t {{.IMAGE}}:{{.TAG}} -t {{.DOCKERHUB_IMAGE}}:{{.TAG}} .. --push
      - docker buildx build --platform linux/arm64 -f Dockerfile --build-arg APK_REPOSITORY={{default "" .APK_REPOSITORY}} --build-arg BEACON_VERSION={{.BEACON_VERSION}} --build-arg COLLIA_VERSION={{.COLLIA_VERSION}} --provenance=false --sbom=0 -t {{.IMAGE_ARM}}:{{.TAG}} -t {{.DOCKERHUB_IMAGE_ARM}}:{{.TAG}} .. --push
