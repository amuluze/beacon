          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InstallTokenResponse"
  "/api/v1/host/report":
    post:
      tags:
      - host
      summary: Agent monitoring report
      deprecated: true
      description: |
        Receives a monitoring data batch from an Agent and persists it atomically.
        Must include `X-Agent-ID` or `agent_id` in the request. Auth is the
        `X-Install-Token` request header ONLY (query tokens are never accepted);
        when the Server has no install token configured the endpoint returns
        503 and rejects all uploads. Rate-limited to 60 req/min per Agent ID
        (falling back to client IP when no Agent ID is present).

        Deprecated: the primary report channel is now the control connection's
        data stream over the Unix-socket control channel (a separate stream on
        the same connection). This endpoint remains as a compatibility fallback
        for Agents that cannot open the data stream and will be removed in a
        later release.
      operationId: report
      security:
      - InstallToken: []
      parameters:
      - "$ref": "#/components/parameters/XAgentID"
      - in: query
        name: agent_id
        schema:
          type: string
      responses:
        '400':
          description: Missing Agent ID or malformed batch
        '401':
          description: Missing or invalid install token
        '429':
          description: Too many requests (rate limited)
        '503':
          description: Install token not configured on the Server
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReportResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReportMonitorReportArgs"
