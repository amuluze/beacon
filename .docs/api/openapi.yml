  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: beacon_access_token
      description: |
        浏览器会话鉴权：登录写入的 HttpOnly、SameSite=Strict access Cookie，
        由 UserAuthMiddleware 校验；状态变更请求另有 CSRF 双提交
        （X-CSRF-Token header + beacon_csrf_token Cookie）。绝大多数 /api/v1
        路由使用该方案（本文件根级 security 默认）。
    InstallToken:
      type: apiKey
      in: header
      name: X-Install-Token
      description: |
        Agent 安装/上报共享 Token：部署期静态持久配置值（无 TTL 语义，见
        release-install IR008/IR014）。用于 POST /api/v1/host/report 与
        GET /api/v1/host/install/* 下载端点（后者亦可改用 Bearer）。
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        仅作为 GET /api/v1/host/install/* 下载端点除 X-Install-Token 外的
        备选凭据；浏览器 API 不使用 Bearer JWT（会话由 CookieAuth 承载）。
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: beacon_refresh_token
      description: 刷新会话使用 Refresh Cookie；不要求 Access Cookie，仍须 CSRF Cookie 与请求头双提交校验。
