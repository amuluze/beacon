components:
  parameters:
    XAgentID:
      in: header
      name: X-Agent-ID
      required: false
      schema:
        type: string
      description: |
        Identifies the target Agent for control-plane endpoints. Required for
        any host.* or container.* path; the repository layer (see
        RequireAgentID in beacon/pkg/contextx) rejects the request with
        HTTP 400 when missing.
  schemas:
    AgentItem:
      properties:
        agent_id:
          type: string
