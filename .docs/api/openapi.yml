  "/api/v1/host/install":
    get:
      tags:
      - host
      summary: 获取 Collia 安装脚本
      description: |
        返回指定节点的 bash 安装脚本。脚本本身公开（仅受 `AgentInstall.Enable` 门禁），
        安装 Token 由执行参数 `--token=<token>` 传入；脚本内部下载包、配置与证书的请求
        再以 `X-Install-Token` 头携带同一 Token。
      operationId: agentInstallScript
      security: []
      parameters:
      - in: query
        name: node
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        description: 目标节点标识（字母或数字开头，仅含字母、数字、点、下划线、短横线）
      responses:
        '400':
          description: Missing or invalid node
        '404':
          description: Agent installation is disabled
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Downloaded text; Content-Type is resolved from the file extension
            by Fiber and the host MIME database
          content:
            "*/*":
              schema:
                type: string
