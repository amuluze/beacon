      summary: 获取 Collia 安装令牌
      description: Issues a short-lived ephemeral install token (bpit.&lt;exp&gt;.&lt;nonce&gt;.&lt;hmac&gt;,
        HMAC key derived from the static install token; default TTL 1800s, overridable
        via AgentInstall.TokenTTL where a negative value falls back to the static
        token). Admin only, auto-audited, no-store.
