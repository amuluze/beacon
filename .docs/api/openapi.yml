openapi: 3.0.3
info:
  title: Beacon API
  description: Beacon Server HTTP API。方法与路径由运行时注册对账；JSON 字段由 Go AST 导出并对账，x-go-validate
    保留服务端验证规则。204 响应无正文；下载与 WebSocket 单独建模。此契约不代替鉴权与业务行为测试。
  version: 3.0.11
  contact:
    name: Beacon
servers:
- url: http://localhost:8000
  description: Local development server
tags:
- name: index
- name: user
- name: role
- name: resource
- name: agent
- name: auth
- name: container
- name: host
- name: audit
- name: mail
- name: alarm
- name: dingtalk
- name: ops
security:
- CookieAuth: []
paths:
  "/health":
    get:
      tags:
      - ops
      summary: Liveness probe
      description: Returns HTTP 200 if the process is running. No authentication required.
      operationId: liveness
      security: []
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
  "/ready":
    get:
      tags:
      - ops
      summary: Readiness probe
      description: Returns HTTP 200 when all dependencies (DB, reverse-tunnel) are
        healthy; HTTP 503 when DB ping reports an error.
      operationId: readiness
      security: []
      responses:
        '503':
          description: Server is not ready
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
  "/ws/terminal":
    get:
      tags:
      - ops
      summary: WebSocket upgrade for terminal channel
      description: Same-origin upgrade authenticated by the HttpOnly access Cookie
        (`WebSocketUserAuthMiddleware`，Auth.Enable 时；未启用时存在无 Cookie 认证的回退注册分支); rejects
        plain HTTP with 426 and cross-origin attempts with 401.
      operationId: wsTerminal
      security:
      - CookieAuth: []
      parameters:
      - in: cookie
        name: beacon_access_token
        required: true
        schema:
          type: string
      responses:
        '101':
          description: Switching protocols
        '401':
          description: Cross-origin or unauthenticated
        '426':
          description: Upgrade required
  "/ws/{id}":
    get:
      tags:
      - ops
      summary: Same-origin WebSocket upgrade for Cookie-authenticated log streaming
      description: Container log stream keyed by container id; same-origin + HttpOnly
        access Cookie (`WebSocketUserAuthMiddleware`，Auth.Enable 时；未启用时存在无 Cookie
        认证的回退注册分支).
      operationId: wsLogStream
      security:
      - CookieAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: cookie
        name: beacon_access_token
        required: true
        schema:
          type: string
      responses:
        '101':
          description: Switching protocols
        '401':
          description: Cross-origin or unauthenticated
        '426':
          description: Upgrade required
  "/api/v1/index/index":
    get:
      tags:
      - index
      summary: Hello-world sanity endpoint
      operationId: hello
      security: []
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: hello world
          content:
            text/plain:
              schema:
                type: string
  "/api/v1/auth/csrf":
    get:
      tags:
      - auth
      summary: Provision the readable pre-authentication CSRF Cookie
      operationId: csrf
      security: []
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '204':
          description: Success; no response body
  "/api/v1/auth/login":
    post:
      tags:
      - auth
      summary: User login
      description: Authenticate with username and password. JWTs are returned only
        as HttpOnly, SameSite Cookies. Rate-limited to 10 req/min/IP. No session required
        (skipped by commonAuthSkipperPaths).
      operationId: login
      security: []
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - in: cookie
        name: beacon_csrf_token
        required: true
        schema:
          type: string
      responses:
        '429':
          description: Too many requests (rate limited)
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResult"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginArgs"
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/LoginArgs"
          application/x-www-form-urlencoded:
            schema:
              "$ref": "#/components/schemas/LoginArgs"
  "/api/v1/auth/logout":
    post:
      tags:
      - auth
      summary: User logout
      operationId: logout
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - in: cookie
        name: beacon_access_token
        required: true
        schema:
          type: string
      - in: cookie
        name: beacon_refresh_token
        required: true
        schema:
          type: string
      - in: cookie
        name: beacon_csrf_token
        required: true
        schema:
          type: string
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '204':
          description: Success; no response body
  "/api/v1/auth/pass_update":
    post:
      tags:
      - auth
      summary: Update password
      operationId: passUpdate
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - in: cookie
        name: beacon_access_token
        required: true
        schema:
          type: string
      - in: cookie
        name: beacon_refresh_token
        required: true
        schema:
          type: string
      - in: cookie
        name: beacon_csrf_token
        required: true
        schema:
          type: string
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '204':
          description: Success; no response body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordUpdateArgs"
  "/api/v1/auth/token_update":
    post:
      tags:
      - auth
      summary: Rotate access and refresh Cookies
      description: Uses the HttpOnly refresh Cookie plus X-CSRF-Token. Returns 204
        and rotates Cookies without exposing JWTs in the body.
      operationId: tokenUpdate
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - in: cookie
        name: beacon_refresh_token
        required: true
        schema:
          type: string
      - in: cookie
        name: beacon_csrf_token
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Refresh Cookie invalid; client clears local user state
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '204':
          description: Success; no response body
      security:
      - RefreshCookieAuth: []
  "/api/v1/auth/user_info":
    get:
      tags:
      - auth
      summary: Current user info + permissions
      operationId: userInfo
      parameters:
      - in: cookie
        name: beacon_access_token
        required: true
        schema:
          type: string
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserInfo"
  "/api/v1/agent/list":
    get:
      tags:
      - agent
      summary: List known Agents
      description: |
        Returns the list of Agents known to the Server. The lifecycle status is
        projected from the current Server process's live reverse-tunnel registry;
        a persisted status left by an earlier process is not treated as current.
      operationId: listAgents
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  "$ref": "#/components/schemas/ModelAgent"
  "/api/v1/agent/update_setting":
    get:
      tags:
      - agent
      summary: 查询 Agent 自动更新设置
      description: |
        返回控制台的 Agent 自动更新开关；记录缺失时按产品默认值返回 true（默认开启）。
        deployment_enabled 表示部署级门禁（AgentUpdate.Enable），为 false 时控制台开关不可用。
      operationId: getAgentAutoUpdateSetting
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AgentAutoUpdateSetting"
    post:
      tags:
      - agent
      summary: 更新 Agent 自动更新设置
      description: |
        管理员专属资源。开关只影响 Agent 注册后的自动调度；
        关闭后手动升级仍可用（POST /api/v1/agent/upgrade），也不改变部署级门禁。
      operationId: updateAgentAutoUpdateSetting
      responses:
        '400':
          description: auto_update is required
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AgentAutoUpdateSetting"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AgentAutoUpdateSettingArgs"
  "/api/v1/user/user_query":
    get:
      tags:
      - user
      summary: 查询用户
      operationId: userQuery
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserQueryReply"
      parameters:
      - in: query
        name: id
        required: false
        schema:
          type: string
      - in: query
        name: ids
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
      - in: query
        name: status
        required: false
        schema:
          type: integer
      - in: query
        name: username
        required: false
        schema:
          type: string
      - in: query
        name: usernames
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
  "/api/v1/user/user_create":
    post:
      tags:
      - user
      summary: 创建用户
      operationId: userCreate
      responses:
        '400':
          description: Invalid input
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '204':
          description: Success; no response body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserCreateArgs"
  "/api/v1/user/user_update":
    post:
      tags:
      - user
      summary: 更新用户
      operationId: userUpdate
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '204':
          description: Success; no response body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserUpdateArgs"
  "/api/v1/user/user_delete":
    post:
      tags:
      - user
      summary: 删除用户
      operationId: userDelete
      responses:
        '400':
          description: Invalid or empty user targets
        '404':
          description: User target not found
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '204':
          description: Success; no response body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserDeleteArgs"
  "/api/v1/role/role_query":
    get:
      tags:
      - role
      summary: 查询角色
      operationId: roleQuery
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RoleQueryReply"
      parameters:
      - in: query
        name: id
        required: false
        schema:
          type: string
      - in: query
        name: ids
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
      - in: query
        name: name
        required: false
        schema:
          type: string
      - in: query
        name: names
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
      - in: query
        name: status
        required: false
        schema:
          type: integer
  "/api/v1/role/role_create":
    post:
      tags:
      - role
      summary: 创建角色
      operationId: roleCreate
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '204':
          description: Success; no response body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RoleCreateArgs"
  "/api/v1/role/role_update":
    post:
      tags:
      - role
      summary: 更新角色
      operationId: roleUpdate
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '204':
          description: Success; no response body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RoleUpdateArgs"
  "/api/v1/role/role_delete":
    post:
      tags:
      - role
      summary: 删除角色
      operationId: roleDelete
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '204':
          description: Success; no response body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RoleDeleteArgs"
  "/api/v1/resource/resource_query":
    get:
      tags:
      - resource
      summary: 查询资源
      operationId: resourceQuery
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ResourceQueryReply"
      parameters:
      - in: query
        name: id
        required: false
        schema:
          type: string
  "/api/v1/agent/upgrade":
    post:
      tags:
      - agent
      summary: 升级目标 Agent 的 Collia
      description: |
        升级目标 Agent 上运行的 Collia。同一 Agent 不支持并发升级，全局并发受限；
        升级版本来自 Server 镜像内置版本。升级窗口内该节点的数据短暂中断。
        管理员专属资源（Casbin 策略仅放行 admin），开始/成功/失败均写系统审计。
      operationId: agentUpgrade
      responses:
        '400':
          description: Unsupported arch, downgrade blocked, or invalid version
        '409':
          description: Upgrade already in progress
        '503':
          description: Updater unavailable
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UpgradeResult"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpgradeArgs"
  "/api/v1/system/version":
    get:
      tags:
      - system
      summary: 查询 Beacon 版本与更新状态
      description: |
        返回当前 Beacon Server 的构建版本与最近一次更新检查结果。
        Server 自身不执行升级：update_available 只表示存在更新的 Beacon 版本，
        是否升级由管理员手动执行升级命令决定。
      operationId: getSystemVersion
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SystemVersion"
  "/api/v1/container/version":
    get:
      tags:
      - container
      summary: 获取 Docker 版本信息
      operationId: containerVersion
      parameters:
      - "$ref": "#/components/parameters/XAgentID"
      responses:
        default:
          description: 'Failure: status text from middleware, err/msg from business
            handlers, or error from report/rate limiter'
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ErrorResponse"
                - "$ref": "#/components/schemas/ReportError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Docker"
  "/api/v1/container/containers":
    get:
      tags:
      - container
      summary: 获取容器列表
      description: Returns the latest container list for the selected Agent.
      operationId: containerList
      parameters:
      - in: header
        name: X-Agent-ID
        schema:
          type: string
        required: true
        description: Target Agent identifier
      - in: query
        name: name
        required: false
        schema:
          maxLength: 128
          type: string
          x-go-validate: omitempty,max=128
      - in: query
        name: network
        required: false
        schema:
          maxLength: 128
          type: string
          x-go-validate: omitempty,max=128
      - in: query
        name: page
        required: true
        schema:
          minimum: 1
          not:
            enum:
            - 0
